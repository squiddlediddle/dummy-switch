<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d88d8">

<title>The Nerd Switch</title>

<!-- KaTeX from CDN. If offline, the reader falls back to raw $...$ text. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<style>
  /* Literata variable font (OFL) — latin subset. The single-file share
     inlines this as a data URI (build_share.py) so it works offline. */
  @font-face {
    font-family: "Literata";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("fonts/literata-var-latin.woff2") format("woff2");
  }

  /* the two font stacks the whole app uses — change them here */
  :root {
    --font-serif: "Literata", Georgia, "Times New Roman", serif;
    --font-ui: system-ui, -apple-system, sans-serif;
  }

  /* Original (blue) — light (default) */
  :root {
    --bg: #e2e2e7;
    --ink: #3d3d3d;
    --muted: #3d3d3d;
    --card: #ffffff;
    --accent: #3d88d8;
    --accent-ink: #ffffff;
    --line: #e4e0d6;
    --code-bg: #e4e7f1b2;
    --quote-bg: #ffffff;
    --quote-ink: #3d3d3d;
    --fs: 17px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: var(--fs);
    line-height: 1.65;
  }

  #topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
    background: var(--accent);
    border-bottom: none;
    /* light drop shadow under the bar so it reads as slightly raised
       (~10px blur, low opacity — content scrolls beneath it) */
    box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
    font-family: var(--font-ui);
    font-size: 13px;
  }
  #topbar .app { font-weight: 700; letter-spacing: .02em; white-space: nowrap; color: #fff; }
  #topbar .spacer { flex: 1; }
  /* the badge counter and the share button are white pills with blue ink,
     flipped against the blue bar; the ☰ home button keeps its plain
     bordered look (transparent, white border/icon) */
  #topbar button.badge, #topbar #topBtn {
    padding: 3px 10px; border-radius: 999px;
    background: #fff; color: var(--accent);
    border: none; font-weight: 600; white-space: nowrap;
  }
  #topbar button.badge:hover, #topbar #topBtn:hover { filter: brightness(.97); }
  #topbar button {
    background: transparent; color: #fff;
    border: 1px solid rgba(255, 255, 255, .55); border-radius: 8px;
    padding: 4px 10px; cursor: pointer; font-size: 13px;
  }
  #topbar button:hover { color: #fff; border-color: #fff; }
  #topbar button.badge:hover { color: var(--accent); border-color: var(--accent); }

  #container {
    height: calc(100vh - 46px);
    height: calc(100dvh - 46px);
    overflow-y: auto;
    position: relative;
  }
  #doc {
    max-width: 46rem;
    margin: 0 auto;
    padding: 2.2rem 1.4rem 8rem;
  }
  #doc.hidden, #library.hidden, #badge.hidden { display: none; }

  /* library (paper picker) */
  #library {
    max-width: 46rem;
    margin: 0 auto;
    padding: 2.2rem 1.4rem 8rem;
  }
  #library h1 {
    font-family: var(--font-ui);
    font-size: .8em; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    margin: 0 0 1.2em;
  }
  .lib-card {
    display: block; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line);
    padding: 1.1rem 1.3rem; margin: 0 0 1rem; cursor: pointer;
    font-family: var(--font-serif); color: var(--ink);
  }
  .lib-card:hover { border-color: var(--accent); }
  .lib-card h2 { margin: 0 0 .1em; border: none; font-size: 1.25em; }
  .lib-card .byline { margin: 0 0 .7em; color: var(--muted); font-size: .92em; }
  .lib-card .subtitle { margin: 0 0 .25em; color: var(--muted); font-size: .95em; }
  .lib-empty { color: var(--muted); font-style: italic; }

  /* short how-to tip above the paper cards */
  #library .howto {
    font-family: var(--font-ui);
    font-size: .85em; color: var(--muted);
    line-height: 1.55;
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: .7em 1em;
    margin: 0 0 1.4em;
  }

  .doc-title h1 { font-size: 1.9em; line-height: 1.15; margin: 0 0 .2em; }
.doc-title h2 { font-size: 1.25em; font-weight: 600; color: var(--muted); margin: 0 0 .1em; }

  .doc-title .byline { font-size: .95em; color: var(--muted); margin: 0 0 1.2em; }

  .doc-title h3 { font-size: 1em; font-style: italic; color: var(--accent); margin: 0 0 1.2em; }
  h2, h3 { line-height: 1.3; margin: 1.8em 0 .6em; }
  h2 { font-size: 1.35em; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
  h3 { font-size: 1.1em; }

  p { margin: 0 0 1em; }

  /* explained (blue panel) blocks — same blue as the UI accent, white text,
     and the font size stays identical to the rest of the paper */
  .toggleable { cursor: pointer; }
  /* switchable blocks are outlined at all times, on every device, so they
     read as clickable — except once switched: the explained blue panel
     wears no outline (the panel itself is the "explained" state; the
     pointer cursor and the badge still mark it as revertible). Hover just
     thickens the line. Outlines don't participate in layout, so the
     zero-shift guarantee is unaffected. */
  /* clickable boxes: white outline (2px so it reads on the grey app
     background), blue on hover — the explained panels themselves have
     no outline */
  .toggleable:not(.explained) { outline: 2px solid #ffffff; outline-offset: 3px; }
  .toggleable:not(.explained):hover { outline: 2px solid var(--accent); }
  .explained {
    --bg: #3d88d8;
    --ink: #ffffff;
    --muted: rgba(255, 255, 255, .82);
    --card: #3d88d8;
    --accent: #ffffff;
    --accent-ink: #3d88d8;
    --line: rgba(255, 255, 255, .4);
    --code-bg: #3579c4;
    --quote-bg: #3579c4;
    --quote-ink: #ffffff;
    font-size: var(--fs);
    background: var(--card);
    color: var(--ink);
  }
  /* a few px of air around the text of explained paragraphs/lists: the
     negative margins cancel the added padding exactly, so the text and the
     flow keep their positions — only the blue box grows outward.
     The sides are set individually (NOT the `padding` shorthand) because a
     shorthand would also reset padding-left, and for lists that padding is
     the bullet indent — see the list rule below. */
  p.explained, ul.explained, ol.explained {
    padding-top: 5px;
    padding-right: 8px;
    padding-bottom: 5px;
    margin: -5px -8px calc(1em - 5px);
  }
  p.explained { padding-left: 8px; }
  /* Lists: keep the 1.6em indent (that's what positions the item text) and
     widen it by the same 8px the negative margin moved the box left, so the
     text stays put while the blue grows leftwards — far enough that the
     bullet/number markers, which browsers draw in the padding area just
     outside the text, land INSIDE the panel instead of hanging off its left
     edge. Nested lists keep the plain 1.6em (the outer panel already covers
     them and they must not inherit the widened indent). */
  ul.explained, ol.explained { padding-left: calc(1.6em + 8px); }
  ul.explained ul, ul.explained ol, ol.explained ul, ol.explained ol {
    padding-left: 1.6em;
  }

  /* explained blocks that already carry their own padding keep it */
  .explained pre, .explained blockquote, .explained table, .explained .callout { margin: 0; }
  .explained .callout { background: var(--code-bg); }

  /* the explained prefix echoes the drafted ✳️***Explained:*** markers —
     a white square ✳ badge, then a bold italic "Explained:" label. The gap
     between the badge and the label is a single typed space (the text node
     below), so the whole prefix reads "✳️ Explained:" with the explanation
     starting right after it on the same line. The badge color is the literal
     brand blue, NOT var(--accent), because --accent is redefined to white
     inside panels. Inline everywhere; for lists it is injected into the
     first list item (see buildEl). */
  .exlab { font-weight: 700; font-style: italic; white-space: nowrap; }
  .exlab .exstar {
    display: inline-block;
    width: 1.05em;
    height: 1.05em;
    background: #ffffff;
    color: #3d88d8;
    text-align: center;
    line-height: 1.1em;
    font-size: .9em;
    vertical-align: -.12em;
  }

  blockquote {
    margin: 1em 0; padding: .6em 1.1em;
    border-left: 3px solid var(--accent);
    background: var(--quote-bg);
    font-style: italic; color: var(--quote-ink);
  }
  .callout {
    margin: 1em 0;
    padding: .8em 1em;
    background: var(--card);
    /* border: 1px solid var(--line); */
    /* border-radius: 10px; */
  }
  .callout .clabel {
    display: inline-block; margin-bottom: .35em;
    font-family: var(--font-ui); font-weight: 700; font-size: .8em;
    color: var(--accent); text-transform: uppercase; letter-spacing: .06em;
  }
  ul, ol { margin: 0 0 1em; padding-left: 1.6em; }
  li { margin: .25em 0; }
  table { border-collapse: collapse; margin: 1em 0; width: 100%; font-size: .92em; }
  th, td { border: 1px solid var(--line); padding: .45em .6em; text-align: left; vertical-align: top; }
  th { background: var(--code-bg); }
  pre {
    background: var(--card);
    /* border: 1px solid var(--line); */
    padding: .9em 1em;
    /* border-radius: 10px; */
    overflow-x: auto;
    font-size: .85em;
    line-height: 1.45;
  }
  code { font-family: "Cascadia Code", Consolas, monospace; font-size: .9em; }
  p code, li code, td code, th code { background: var(--code-bg); padding: .05em .35em; border-radius: 5px; }
  .math-raw { font-style: italic; color: var(--accent); font-family: "Cascadia Code", Consolas, monospace; }

  

  .foot {
    margin-top: 3em; color: var(--muted); font-size: .8em;
    border-top: 1px solid var(--line); padding-top: 1em;
  }
</style>
</head>
<body>

<header id="topbar">
  <span class="app">The Nerd Switch</span>
  <button id="homeBtn" title="Library">☰</button>
  <span class="spacer"></span>
  <button id="topBtn" title="Back to top">↑</button>
  <button id="badge" class="badge" title="Click: turn off all explanations — or when none are on, turn them all on">Original</button>
</header>

<main id="container">
  <div id="doc"></div>
  <div id="library" class="hidden"><p class="howto">Every outlined block has an explanation. Click to switch; click again to switch back.</p><h1>Library</h1><div id="libList"></div></div>
</main>

<script src="bundle-light-reality-cycle.js"></script>
<script src="bundle-the-theory.js"></script>
<!-- add one <script src="bundle-<id>.js"></script> per paper (build with build_bundle.py) -->
<script>
"use strict";

/* ------------------------------------------------------------------ */
/* state                                                               */
/* ------------------------------------------------------------------ */

var BUNDLES = window.PAPER_BUNDLES || {};
var state = {
  topIndex: 0,        // item index currently at the top of the viewport
  items: [],          // flattened paper: {kind, o, e}
  els: [],            // rendered DOM elements aligned to items
  explained: {},      // item index -> true when that block shows the "everyone" voice
  bundle: null        // selected paper bundle (null = library view)
};
var PROG_KEY = "ds.progress:";  // {i, x} — full per-paper key set in openBundle()
var LAST_KEY = "ds.last";       // last opened bundle id

/* ------------------------------------------------------------------ */
/* flatten bundle -> items                                             */
/* ------------------------------------------------------------------ */

function flatten(B) {
  var items = [];
  items.push({ kind: "title", o: {
      kind: "title",
      title: B.title.original, subtitle: B.subtitle.original, tagline: B.tagline.original,
      author: B.author
    }, e: {
      kind: "title",
      title: B.title.everyone, subtitle: B.subtitle.everyone, tagline: B.tagline.everyone,
      author: B.author
    }});
  if (B.epigraph && (B.epigraph.original || B.epigraph.everyone)) {
    items.push({ kind: "quote", o: side("quote", B.epigraph.original), e: side("quote", B.epigraph.everyone) });
  }
  (B.lead || []).forEach(function (p) {
    if (p.original || p.everyone) items.push({ kind: pairKind(p), o: p.original, e: p.everyone });
  });
  B.sections.forEach(function (sec) {
    items.push({ kind: "heading", level: 2, o: sec.heading.original, e: sec.heading.everyone });
    sec.blocks.forEach(function (p) { items.push({ kind: pairKind(p), o: p.original, e: p.everyone }); });
    (sec.subsections || []).forEach(function (sub) {
      items.push({ kind: "heading", level: 3, o: sub.heading.original, e: sub.heading.everyone });
      sub.blocks.forEach(function (p) { items.push({ kind: pairKind(p), o: p.original, e: p.everyone }); });
    });
  });
  return items;
}
function side(kind, obj) {
  if (!obj) return null;
  if (typeof obj === "string") return { kind: kind, text: obj };
  return { kind: kind, text: obj.text };
}
function pairKind(p) { return (p.original || p.everyone || {}).kind || "paragraph"; }

/* ------------------------------------------------------------------ */
/* rendering                                                           */
/* ------------------------------------------------------------------ */

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function renderMath(src) {
  try {
    if (window.katex) return window.katex.renderToString(src, { throwOnError: false, displayMode: false });
  } catch (e) {}
  return '<span class="math-raw">[' + esc(src) + ']</span>';
}

function mdInline(text) {
  // pull inline math out of the RAW text BEFORE escaping: KaTeX must
  // receive unescaped LaTeX — esc() would turn a prime (' -> &#39;) and
  // any &, <, >, " into entities and KaTeX would choke on them
  var math = [];
  var t = text.replace(/\$([^$\n]+)\$/g, function (m, src) {
    math.push(src);
    return "\u0000M" + (math.length - 1) + "\u0000";
  });
  t = esc(t);
  // wikilinks: [[Title]] -> Title ; [[Title|alias]] -> alias
  t = t.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function (m, a, b) { return "<b>" + (b || a) + "</b>"; });
  // markdown links: [text](url) -> text
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1");
  // inline code
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  // bold then italic
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  // reinject typeset math last so KaTeX's HTML never passes the markdown passes
  t = t.replace(/\u0000M(\d+)\u0000/g, function (m, n) { return renderMath(math[+n]); });
  return t;
}

function makeTitle(sideObj) {
  var el = document.createElement("div");
  el.className = "doc-title";
  el.innerHTML = "<h1>" + esc(sideObj.title) + "</h1>"
    + (sideObj.subtitle ? "<h2>" + esc(sideObj.subtitle) + "</h2>" : "")
    + (sideObj.author ? "<p class=\"byline\">by " + esc(sideObj.author) + "</p>" : "")
    + (sideObj.tagline ? "<h3>" + esc(sideObj.tagline) + "</h3>" : "");
  return el;
}
function makeQuote(text) {
  var el = document.createElement("blockquote");
  el.innerHTML = mdInline(text);
  return el;
}
function makeHeading(item, sideObj) {
  sideObj = sideObj || item.o;
  if (!sideObj) return null;
  var el = document.createElement(item.level === 3 ? "h3" : "h2");
  el.textContent = sideObj.text;
  return el;
}
function makeCallout(text) {
  var lines = text.split("\n");
  var label = "";
  var m = lines[0].match(/^\[![a-z]+\]\s*(.*)$/);
  if (m) { label = m[1] || lines[0]; lines = lines.slice(1); }
  var el = document.createElement("div");
  el.className = "callout";
  el.innerHTML = (label ? '<span class="clabel">' + esc(label) + "</span>" : "")
    + lines.map(function (l) { return "<p>" + mdInline(l) + "</p>"; }).join("");
  return el;
}
function makeList(raw) {
  var root = document.createElement("ul");
  var stack = [{ indent: 0, list: root }];
  var first = true;
  raw.split("\n").forEach(function (line) {
    var m = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (!m) return;
    var indent = m[1].replace(/\t/g, "  ").length;
    var numbered = /\d/.test(m[2]);
    // the first line decides the top-level list type
    if (first) {
      if (numbered) {
        var ol = document.createElement("ol");
        root = ol;
        stack = [{ indent: 0, list: ol }];
      }
      first = false;
    }
    // climb back up while the new item is less indented than the current list
    while (stack.length > 1 && indent < stack[stack.length - 1].indent) stack.pop();
    var top = stack[stack.length - 1];
    var li = document.createElement("li");
    li.innerHTML = mdInline(m[3]);
    if (indent > top.indent) {
      // nest inside the previous item (skip if the list is still empty)
      var parent = top.list.lastChild;
      if (parent) {
        var nested = document.createElement(numbered ? "ol" : "ul");
        parent.appendChild(nested);
        stack.push({ indent: indent, list: nested });
        top = stack[stack.length - 1];
      }
    }
    top.list.appendChild(li);
  });
  return root;
}
function makeTable(raw) {
  var rows = raw.split("\n").filter(function (r) { return r.trim(); });
  var table = document.createElement("table");
  rows.forEach(function (row, ri) {
    var cells = row.replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
    var tr = document.createElement("tr");
    cells.forEach(function (c) {
      var cell = document.createElement(ri === 0 ? "th" : "td");
      cell.innerHTML = mdInline(c);
      tr.appendChild(cell);
    });
    table.appendChild(tr);
  });
  return table;
}
function makeCode(text) {
  var pre = document.createElement("pre");
  var code = document.createElement("code");
  code.textContent = text;
  pre.appendChild(code);
  return pre;
}
function makeParagraph(text) {
  var el = document.createElement("p");
  el.innerHTML = mdInline(text);
  return el;
}

// structural blocks (the title) always stay in the original voice; everything
// else follows the per-block "explained" flag when set. Section headings never
// click anyway (their text is identical on both sides); a content block that
// is rendered as a heading-style flow map (e.g. the LRC cycle line) CAN toggle.
function isStructural(item) { return item.kind === "title"; }
function isToggleable(item) {
  // only blocks whose "for everyone" version actually differs are clickable —
  // identical blocks (and structural ones) stay plain
  return !isStructural(item) && !!item.o && !!item.e && item.o.text !== item.e.text;
}
function sideFor(item, i) {
  return (state.explained[i] && item.e) ? item.e : item.o;
}
function buildEl(item, i) {
  var sideObj = sideFor(item, i);
  if (!sideObj) return null;
  var el;
  switch (sideObj.kind) {
    case "title":    el = makeTitle(sideObj); break;
    case "heading":  el = makeHeading(item, sideObj); break;
    case "quote":    el = makeQuote(sideObj.text); break;
    case "callout":  el = makeCallout(sideObj.text); break;
    case "list":     el = makeList(sideObj.text); break;
    case "table":    el = makeTable(sideObj.text); break;
    case "code":     el = makeCode(sideObj.text); break;
    case "paragraph":
    default:         el = makeParagraph(sideObj.text); break;
  }
  if (isToggleable(item)) el.className += " toggleable";
  if (state.explained[i] && item.e) {
    el.className += " explained";
    // prefix the panel with the ✳ badge + "Explained:" label — always
    // inline with the following text: for list blocks the label goes into
    // the FIRST item so "✳️ Explained: first item…" stays on one line.
    // Skipped for table/code/callout where an inline injection would break
    // the structure (none of the current papers produce explained blocks
    // of those kinds).
    var k = item.e.kind;
    if (k !== "table" && k !== "code" && k !== "callout") {
      var lab = document.createElement("span");
      lab.className = "exlab";
      var badge = document.createElement("b");
      badge.className = "exstar";
      badge.textContent = "\u2733"; /* ✳ */
      lab.appendChild(badge);
      lab.appendChild(document.createTextNode(" Explained: "));
      var host = el;
      if (k === "list" && el.firstElementChild) host = el.firstElementChild;
      host.insertBefore(lab, host.firstChild);
    }
  }
  return el;
}

/* ------------------------------------------------------------------ */
/* rendering pipeline + scroll preservation                            */
/* ------------------------------------------------------------------ */

var container = document.getElementById("container");
var doc = document.getElementById("doc");

function topVisible() {
  // returns {index, offset} of the item nearest the top of the viewport
  for (var i = state.els.length - 1; i >= 0; i--) {
    var el = state.els[i];
    if (el && el.offsetTop <= container.scrollTop + 12) {
      return { index: i, offset: container.scrollTop - el.offsetTop };
    }
  }
  return { index: 0, offset: 0 };
}

function render() {
  var anchor = topVisible();
  doc.innerHTML = "";
  state.els = [];

  // first pass: build elements (respecting per-block explained flags)
  state.items.forEach(function (item, i) {
    var el = buildEl(item, i);
    if (!el) { state.els.push(null); return; }
    el.dataset.i = i;
    doc.appendChild(el);
    state.els.push(el);
  });

  // wait for KaTeX to finish (deferred script) then fix up any raw math
  applyKatexDiffs();

  // restore scroll to the anchored item (fall back to the nearest
  // rendered item above it if this voice has a gap at that index)
  var target = state.els[anchor.index];
  var k = anchor.index;
  while (!target && k >= 0) { target = state.els[--k]; }
  if (target) container.scrollTop = target.offsetTop + anchor.offset;
  else container.scrollTop = 0;
}

function applyKatexDiffs() {
  // Boot renders can run before the deferred KaTeX script has loaded, so
  // they fall back to [raw] placeholders. Once KaTeX is in, upgrade those
  // spans in place to real typeset math (the DOM text node already decoded
  // the entities, so the placeholder source is clean LaTeX again).
  if (!window.katex) return;
  var raws = doc.querySelectorAll(".math-raw");
  if (!raws.length) return;
  for (var i = raws.length - 1; i >= 0; i--) {
    var el = raws[i];
    var m = el.textContent.match(/^\[([\s\S]*)\]$/);
    if (!m) continue;
    var fresh = document.createElement("span");
    fresh.innerHTML = renderMath(m[1]);
    el.parentNode.replaceChild(fresh, el);
  }
}

/* ------------------------------------------------------------------ */
/* persistence                                                         */
/* ------------------------------------------------------------------ */

function saveProgress() {
  var t = topVisible();
  state.topIndex = t.index;
  var x = [];
  Object.keys(state.explained).forEach(function (k) { if (state.explained[k]) x.push(+k); });
  x.sort(function (a, b) { return a - b; });
  localStorage.setItem(PROG_KEY, JSON.stringify({ i: t.index, x: x }));
}

function updateBadge() {
  var n = 0;
  Object.keys(state.explained).forEach(function (k) { if (state.explained[k]) n++; });
  var b = document.getElementById("badge");
  if (!state.bundle) { b.classList.add("hidden"); return; }
  b.classList.remove("hidden");
  b.textContent = n ? (n + " explained") : "Original";
}

/* badge click: if anything is explained, explain nothing; if nothing is
   explained, explain every toggleable block */
function toggleAll() {
  if (!state.bundle) return;
  var n = 0;
  Object.keys(state.explained).forEach(function (k) { if (state.explained[k]) n++; });
  state.explained = {};
  if (n === 0) {
    state.items.forEach(function (item, i) {
      if (isToggleable(item)) state.explained[i] = true;
    });
  }
  updateBadge();
  saveProgress();
  render();
}

/* per-block explain toggle */
function toggleItem(i) {
  var item = state.items[i];
  if (!item || !isToggleable(item)) return false;
  if (state.explained[i]) delete state.explained[i];
  else state.explained[i] = true;
  var old = state.els[i];
  var fresh = buildEl(item, i);
  if (!fresh) { delete state.explained[i]; return false; }
  fresh.dataset.i = i;
  state.els[i] = fresh;
  if (old && old.parentNode) old.parentNode.replaceChild(fresh, old);
  updateBadge();
  saveProgress();
  return true;
}

/* ------------------------------------------------------------------ */
/* library (paper picker)                                              */
/* ------------------------------------------------------------------ */

var library = document.getElementById("library");
var libList = document.getElementById("libList");

function buildLibrary() {
  libList.innerHTML = "";
  var ids = Object.keys(BUNDLES);
  if (!ids.length) {
    var p = document.createElement("p");
    p.className = "lib-empty";
    p.textContent = "No papers yet — build one with: python build_bundle.py";
    libList.appendChild(p);
    return;
  }
  ids.forEach(function (id) {
    var b = BUNDLES[id];
    var card = document.createElement("button");
    card.className = "lib-card";
    // the card shows the paper's full title: main title, then the rest of
    // it (the subtitle) on its own line, then the author. The LRC keeps the
    // dash + period of its displayed form; future papers fall back to their
    // bundle subtitle.
    var sub = { "light-reality-cycle": "Photon Pathways and Perceived Time." }[id]
      || (b.subtitle && (b.subtitle.original || b.subtitle.everyone)) || "";
    card.innerHTML =
        "<h2>" + esc(b.title.original) + "</h2>"
      + (sub ? "<p class=\"subtitle\">" + esc(sub) + "</p>" : "")
      + (b.author ? "<p class=\"byline\">by " + esc(b.author) + "</p>" : "");
    card.addEventListener("click", function () { openBundle(id); });
    libList.appendChild(card);
  });
}

function showLibrary() {
  state.bundle = null;
  state.items = [];
  state.els = [];
  doc.classList.add("hidden");
  library.classList.remove("hidden");
  document.title = "The Nerd Switch";
  container.scrollTop = 0;
  updateBadge();
}

function hideLibrary() {
  library.classList.add("hidden");
  doc.classList.remove("hidden");
}

function openBundle(id) {
  var b = BUNDLES[id];
  if (!b) { showLibrary(); return; }
  state.bundle = b;
  state.items = flatten(b);
  PROG_KEY = "ds.progress:" + b.id;
  try { localStorage.setItem(LAST_KEY, b.id); } catch (e) {}
  var prog = null;
  try { prog = JSON.parse(localStorage.getItem(PROG_KEY) || "null"); } catch (e) {}
  document.title = "The Nerd Switch — " + b.title.original;
  hideLibrary();
  state.explained = {};
  (prog && prog.x || []).forEach(function (i) {
    if (typeof i === "number" && state.items[i]) state.explained[i] = true;
  });
  render();
  updateBadge();
  if (prog && typeof prog.i === "number") {
    var el = state.els[prog.i];
    if (el) container.scrollTop = el.offsetTop - 40;
  }
}

/* ------------------------------------------------------------------ */
/* wiring                                                              */
/* ------------------------------------------------------------------ */

/* click on a block swaps only that block to the "explained" voice (and back) */
doc.addEventListener("click", function (ev) {
  var t = ev.target;
  while (t && t !== doc) {
    var i = t.dataset && t.dataset.i;
    if (i !== undefined) { toggleItem(+i); return; }
    t = t.parentNode;
  }
});
document.getElementById("homeBtn").addEventListener("click", showLibrary);
document.getElementById("badge").addEventListener("click", toggleAll);

var scrollT = null;
container.addEventListener("scroll", function () {
  if (scrollT) return;
  scrollT = setTimeout(function () { scrollT = null; saveProgress(); }, 180);
});
window.addEventListener("beforeunload", saveProgress);

/* back to top: scroll the reading container to the top */
document.getElementById("topBtn").addEventListener("click", function () {
  try { container.scrollTo({ top: 0, behavior: "smooth" }); }
  catch (e) { container.scrollTop = 0; }
});

/* BUILD:SW-START */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
/* BUILD:SW-END */

/* boot */
function boot() {
  buildLibrary();

  // deep link wins (?p=<id>), then the last-opened paper, then the library
  var wanted = "";
  try { wanted = new URLSearchParams(location.search).get("p") || ""; } catch (e) {}
  if (!wanted) {
    try { wanted = localStorage.getItem(LAST_KEY) || ""; } catch (e) {}
  }
  if (BUNDLES[wanted]) openBundle(wanted);
  else showLibrary();
}

/* KaTeX is a deferred script, so the boot render may beat it to the page;
   upgrade any fallback [raw] math spans once the library is in */
window.addEventListener("load", function () {
  if (window.katex) applyKatexDiffs();
});

boot();

/* window.ds seam — used by the automated click tests */
window.ds = {
  state: state,
  toggleItem: toggleItem,
  toggleAll: toggleAll,
  isToggleable: isToggleable,
  isStructural: isStructural,
  sideFor: sideFor,
  render: render
};
</script>
</body>
</html>
