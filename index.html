<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d88d8">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<title>The Nerd Switch</title>

<!-- KaTeX from CDN. If offline, the reader falls back to raw $...$ text. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<style>
  /* Literata variable font (OFL) — latin subset. The single-file share
     inlines this as a data URI (build_share.py) so it works offline. */
  @font-face {
    font-family: "Literata";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("fonts/literata-var-latin.woff2") format("woff2");
  }

  /* the two font stacks the whole app uses — change them here */
  :root {
    --font-serif: "Literata", Georgia, "Times New Roman", serif;
    --font-ui: system-ui, -apple-system, sans-serif;
  }

  /* ------------------------------------------------------------------
     THEME. Two mirrored states, switched by data-theme="invert" on <html>.
     A (the default) is a near-black page carrying near-white cards; B is
     the same scheme turned over — near-white page, near-black cards. The
     how-to line above the library switches them (see initTheme).

     The palette came off the UXtheme01 reference, which turned out to be
     achromatic: #ffffff, #e5e5e5, #161616 and tints, with no accent colour
     anywhere in it (0.20% of pixels clear 0.35 saturation, all of them
     compression ringing). So --accent is unchanged and still the only colour
     in the app, which now means it shows up *only* on the paper's tagline,
     blockquote rules, callout labels, raw-math ink and the panel's ✳ badge —
     it reads louder for being the lone colour.

     Two surfaces exist because --card was doing two jobs. On the library it
     IS the card. Inside a paper it was also the background of pre and
     .callout, where a near-white slab on a near-black page reads as a hole
     punched in the text rather than a raised panel. --surface is that second
     job, kept a hair off the page colour in both states.

     Every ink/background pair below is measured, not eyeballed: the tightest
     is 4.72:1 (muted on bg in state B) where AA wants 4.5. The --muted greys
     are deliberately not #787878 — the obvious "mid grey", and a 4.42:1 fail
     on near-white.

     The --nav-* family is deliberately NOT mirrored. The top bar is chrome,
     not content: it holds the app name and the home control at every scroll
     position and on every paper, and letting it turn over meant a white bar
     sitting on a near-black paper while the page underneath inverted. Those
     four tokens are declared once here and never repeated in the state B
     block, so the bar keeps the near-black of state A in both themes. The
     hint button below the nav still uses --chrome and still inverts — that
     one is content, and it is the control doing the inverting. */
  :root {
    /* A — default */
    --bg: #161616;
    --ink: #f2f2f2;
    --muted: #a0a0a0;
    --surface: #1f1f1f;
    --card: #fcfcfc;
    --card-ink: #161616;
    --card-muted: #6e6e6e;
    --card-line: #e2e2e2;
    --line: #333333;
    --chrome: #161616;
    --chrome-ink: #ffffff;
    --chrome-line: rgba(255, 255, 255, .92);
    --chrome-edge: rgba(255, 255, 255, .55);
    /* Nav is fixed in both states — see the note above the block. Values are
       state A's, kept here so the top bar reads as one unchanging surface. */
    --nav: #161616;
    --nav-ink: #ffffff;
    --nav-line: rgba(255, 255, 255, .92);
    --nav-edge: rgba(255, 255, 255, .55);
    --outline: #f2f2f2;
    --accent: #3d88d8;
    --accent-ink: #ffffff;
    --code-bg: rgba(255, 255, 255, .10);
    --quote-bg: #1f1f1f;
    --quote-ink: #f2f2f2;
    --fs: 17px;
  }

  /* B — the mirror. Only the tokens that change are listed. */
  :root[data-theme="invert"] {
    --bg: #f6f6f6;
    --ink: #161616;
    --muted: #6e6e6e;
    --surface: #ffffff;
    --card: #161616;
    --card-ink: #fcfcfc;
    --card-muted: #a8a8a8;
    --card-line: #2e2e2e;
    --line: #dddddd;
    --chrome: #ffffff;
    --chrome-ink: #161616;
    --chrome-line: rgba(22, 22, 22, .18);
    --chrome-edge: rgba(22, 22, 22, .38);
    --outline: #161616;
    --code-bg: rgba(22, 22, 22, .07);
    --quote-bg: #ffffff;
    --quote-ink: #161616;
  }
  /* ------------------------------------------------------------------
     READING VIEW. A paper is open — the page is the paper, so it is
     always white, whichever of the two library states the reader chose.
     The hint above the library list is the only control for that choice
     (initTheme); it has no say down here.

     This block sits AFTER state B on purpose. Both selectors are
     :root[attribute] = specificity (0,2,0), so source order is the tie
     break, and a paper must win over the stored theme in either state.
     It is a token swap, not a new theme: no token is invented here that
     the light state does not already use, so the two paths cannot drift.

     --bg is pure #ffffff rather than state B's #f6f6f6: this is the
     surface the reading tokens were measured against for the body ink
     (17.4:1) and the muted greys (#6e6e6e = 5.1:1, up from 4.72:1 on
     #f6f6f6), and a paper wants the true white. --surface is *not*
     white — it backs <pre> and .callout, which would otherwise vanish
     into the page — so it keeps #f6f6f6 as a quiet slab.

     --outline has to be stated here, not left to the theme. It marks the
     switchable blocks, and in state A it is near-white (#f2f2f2) because
     state A's page is near-black; on this white page the same near-white
     outline would be invisible, so it takes the dark token. Same job, same
     1px, correct on the surface it is painted on.

     --card* and --chrome* are deliberately absent: they only exist on the
     library, which is display:none while a paper is open, and leaving them
     on the theme tokens keeps the cards switching with the theme when you
     go back. --nav-* is absent for the same reason as above — the bar is
     pinned in :root and never mirrors. */
  :root[data-view="read"] {
    --bg: #ffffff;
    --ink: #161616;
    --muted: #6e6e6e;
    --surface: #f6f6f6;
    --line: #dddddd;
    --outline: #161616;
    --code-bg: rgba(22, 22, 22, .07);
    --quote-bg: #ffffff;
    --quote-ink: #161616;
  }

  /* ------------------------------------------------------------------
     EXPLAIN FOCUS. At least one block is explained, so the reader is
     looking at an explanation and nothing else: the page goes black and
     the panel is the only white thing on it. One class, set by
     updateBadge() from the same count the badge itself uses, so the
     blackout and the "Turn off n explained" pill can never disagree —
     and it drops the moment the last box is switched back.

     The blackout is --bg itself, declared here, so `body { background: var(--bg) }`
     turns black and the canvas goes with it. Painting #container directly was
     tried first and measured wrong: #container is sized `100dvh - 46px`, so on
     the shorter viewport heights a mobile browser reports while its URL bar is
     showing, a white strip was left along the bottom edge — a page-level
     artefact of the same class as the 46px reservation. The token cannot have
     that problem. #container is the bar's SIBLING either way, so the top bar
     keeps its own near-black with its white hairline and shadow: the badge and
     the home control stay usable and stay legible, which is the whole point of
     "not the top bar".

     Everything outside the panel is near-black rather than exactly black:
     the ink, the muted greys, the --surface slabs behind <pre> and
     .callout, the blockquote fill, the code tint and the --outline all
     move to #141414 / #0e0e0e, so those elements do not survive as white
     islands in the blackout the way they would if only the page colour
     changed. Against #000 that is 1.06:1 — unreadable by design, and a
     half-degree visible as a ghost of the page's shape, so it reads as a
     deliberate spotlight rather than a failed render. --accent is pulled
     to the same near-black for the same reason: the taglines, blockquote
     rules, callout labels and raw-math ink all live outside the panel,
     and blue there would be the one thing still lit up.

     Panels re-declare --ink/--muted/--surface/--line on themselves, so
     this only reaches what is NOT explained. */
  :root[data-focus="explain"] {
    --bg: #000000;
    --ink: #141414;
    --muted: #141414;
    --surface: #0e0e0e;
    --line: #101010;
    --outline: #141414;
    --accent: #141414;
    --code-bg: rgba(255, 255, 255, .03);
    --quote-bg: #0e0e0e;
    --quote-ink: #141414;
  }
  /* scrollbar-color keeps the scrollbar out of the blackout on desktop:
     without it the classic scrollbar paints its own light track over the
     black page. Chrome/Firefox only; everywhere else it is ignored. The
     background is not repeated here — it is --bg above. */
  :root[data-focus="explain"] #container {
    scrollbar-color: #3a3a3a #000000;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: var(--fs);
    line-height: 1.65;
  }

  #topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
    background: var(--nav);
    border-bottom: none;
    /* Three layers, top to bottom: the bar itself, a 1px line along its
       bottom edge, then the drop shadow. That line is an *inset* shadow
       rather than `border-bottom` on purpose — the bar is exactly 46px tall
       and #container is sized `calc(100dvh - 46px)`, so a real border would
       make the bar 47px and push the page 1px past the viewport. Inset paints
       inside the bar (no reflow), and the outer shadow still draws below the
       bar, so the line sits between the bar and the shadow. The bar was blue;
       it is now near-black via --nav, which does not change with the theme,
       so this hairline is near-white in both states and can stay a constant. */
    box-shadow: inset 0 -1px 0 var(--nav-line), 0 4px 14px rgba(0, 0, 0, .25);
    font-family: var(--font-ui);
    font-size: 13px;
  }
  #topbar .app { font-weight: 700; letter-spacing: .02em; white-space: nowrap; color: var(--nav-ink); }
  /* The bar's own ink, pinned here rather than left to inheritance. Every child
     already colours itself from --nav-ink, so this changes nothing visible
     today — but body colour is a token, and the explain-focus blackout pulls it
     to near-black, so an uncoloured child added to the bar later would arrive
     dark-on-dark. Pinning it makes "the bar is not part of the blackout" a
     property of the bar rather than of its contents. */
  #topbar { color: var(--nav-ink); }
  #topbar .spacer { flex: 1; }
  /* The badge is the one pill on the bar, and it flips against the bar rather
     than staying blue: white pill / blue text was 3.76:1, and the same blue on
     a near-black bar is 2.60:1, so neither direction passed AA at this size.
     --nav-ink on --nav is 18.1:1 and, like the bar itself, holds in both
     states. The home button takes the plain bordered look below. The to-top
     control used to sit here as well, matched to ☰ as a pair; it now floats
     bottom-right in the Elfsight "Example 1" skin further down, and needs no
     rule of its own here. */
  #topbar button.badge {
    padding: 3px 10px; border-radius: 999px;
    background: var(--nav-ink); color: var(--nav);
    border: none; font-weight: 600; white-space: nowrap;
  }
  #topbar button.badge:hover { filter: brightness(.97); }
  #topbar button {
    background: transparent; color: var(--nav-ink);
    border: 1px solid var(--nav-edge); border-radius: 8px;
    padding: 4px 10px; cursor: pointer; font-size: 13px;
  }
  /* Pin the line box for the icon button so ☰ keeps its exact height — its
     glyph falls back to a font with its own metrics, and 17px is the line box it
     already had, so its appearance is unchanged. The badge pill is excluded and
     keeps `normal`. */
  #topbar button:not(.badge) { line-height: 17px; }
  /* Elfsight Back to Top "Example 1", read off the live widget rather than
     guessed: a white pill, 1px rgba(0,0,0,.3) outline, 8px radius, #141414 ink,
     their exact up-arrow path and a "TO TOP" label. The example floats — "placed
     in the bottom right corner, the Floating type helps it always stay in
     sight" — so this is fixed bottom-right and out of the nav bar, which is back
     to a single icon. The widget's own box is 100x35: 3px of vertical padding
     under a 27px arrow plus the 1px border gives that same 35px here. The
     offsets are the widget's 12px, plus the device safe area so the pill clears
     the home indicator. It belongs to the reading view, so it carries the app's
     `.hidden` class from the markup and only appears while a paper is open. */
  #topBtn {
    position: fixed; z-index: 30;
    right: calc(12px + env(safe-area-inset-right));
    bottom: calc(12px + env(safe-area-inset-bottom));
    display: inline-flex; align-items: center;
    padding: 3px 8px;
    background: #fff; color: #141414;
    border: 1px solid rgba(0, 0, 0, .3); border-radius: 8px;
    font-family: var(--font-ui);
    font-size: 12px; font-weight: 700; line-height: 1; white-space: nowrap;
    cursor: pointer;
  }
  #topBtn .btt-arrow { width: 27px; height: 27px; flex: none; fill: currentColor; }
  #topBtn:hover { background: #f3f3f3; border-color: rgba(0, 0, 0, .45); }
  /* Over the explain-focus blackout the white pill would be the second-brightest
     thing on screen after the panel itself, which breaks the spotlight: it is
     chrome, so it takes the top bar's own treatment instead — transparent with
     a near-white edge and white ink, and a faint wash on hover. Same shape,
     same position, same hit target; only the fill changes. */
  :root[data-focus="explain"] #topBtn {
    background: transparent;
    color: #ffffff;
    border-color: rgba(255, 255, 255, .55);
  }
  :root[data-focus="explain"] #topBtn:hover {
    background: rgba(255, 255, 255, .10);
    border-color: #ffffff;
  }
  #topbar button:hover { color: var(--nav-ink); border-color: var(--nav-ink); }
  /* Pre-existing hover: the pill used to be white-on-blue by default, so
     re-stating --accent here was a visual no-op. Now that the pill inverts to
     near-black ink it would turn the hover into blue text on a near-white
     pill — 3.76:1, the exact pairing the badge rules above exist to avoid.
     Kept in step with the bar's own ink instead; the brightness filter on the
     pill is what still signals the hover. */
  #topbar button.badge:hover { color: var(--nav-ink); border-color: var(--nav-ink); }

  #container {
    height: calc(100vh - 46px);
    height: calc(100dvh - 46px);
    overflow-y: auto;
    position: relative;
  }
  #doc {
    max-width: 46rem;
    margin: 0 auto;
    padding: 2.2rem 1.4rem 8rem;
  }
  /* Two independent reasons the pill can be off screen, kept as two classes so
   neither can clobber the other: `.hidden` = the library is showing (M29),
   `.at-top` = the reader is at the top of a paper, where there is nothing to
   scroll back from (M30). The pill needs BOTH cleared to be visible. */
#doc.hidden, #library.hidden, #badge.hidden,
#topBtn.hidden, #topBtn.at-top { display: none; }

  /* library (paper picker) */
  #library {
    max-width: 46rem;
    margin: 0 auto;
    padding: 2.2rem 1.4rem 8rem;
  }
  #library h1 {
    font-family: var(--font-ui);
    font-size: .8em; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    margin: 0 0 1.2em;
  }
  .lib-card {
    display: flex; align-items: center; gap: 1rem;
    width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--card-line);
    padding: 20px; margin: 0 0 1rem; cursor: pointer;
    font-family: var(--font-serif); color: var(--card-ink);
  }
  /* Hover takes the card's own ink, not --outline: on a near-white card in
     state A the outline is near-white too, so "highlight the border" would
     have nothing to show. --card-ink is the one colour guaranteed to contrast
     with the card it sits on, and it inverts for free. */
  .lib-card:hover { border-color: var(--card-ink); }
  /* The icon slot: a plain rounded square sitting 20px in from the card's left
     edge (the card's padding), with the title/subtitle/author in a column to
     its right. Deliberately empty — it is a placeholder for artwork, and
     nothing should pose as artwork that isn't. `flex: none` keeps it from
     being squeezed by a long title; min-width: 0 on the text column is what
     actually lets a long word wrap instead of widening the card.
     Outline, no fill. A filled slot competed with the title: at 56px a solid
     square reads as an image whether or not there is one, and being achromatic
     it also read as the heaviest thing on the card. An empty outline says
     "slot" and nothing more. Border is --card-muted, the one token already
     tuned to sit legibly on --card in both states (#6e6e6e at 4.9:1 on the
     near-white card, #a8a8a8 at 8.8:1 on the near-black one), so it inverts
     for free without a second value. 1px, not 2px — this is a hairline
     placeholder, and a heavier one would read as a border on the artwork. */
  .lib-card .lib-icon {
    flex: none;
    width: 56px; height: 56px;
    border-radius: 14px;
    border: 1px solid var(--card-muted);
    background: none;
  }
  .lib-card .lib-text { min-width: 0; }
  .lib-card h2 { margin: 0 0 .1em; border: none; font-size: 1.25em; }
  .lib-card .byline { margin: 0 0 .7em; color: var(--card-muted); font-size: .92em; }
  .lib-card .subtitle { margin: 0 0 .25em; color: var(--card-muted); font-size: .95em; }
  .lib-empty { color: var(--muted); font-style: italic; }

  /* The how-to tip above the paper cards is also the theme switch. It keeps
     its sentence and gains a button role: near-black fill with a thin
     near-white outline in state A, mirroring in state B, which is why it
     borrows --chrome / --chrome-ink rather than --card — a card-coloured hint
     would sit on a near-white card and read as part of the list.
     :focus-visible matters here for the first time, since the element is now
     reachable by keyboard; the accent ring is the one colour allowed to
     signal state on this surface.
     This is the one surface that still inverts along with the page. The nav
     bar above it deliberately does not — see the --nav-* note — so this
     button and the paper list are what carry the state change. */
  #library .howto {
    display: block; width: 100%; text-align: left;
    font-family: var(--font-ui);
    font-size: .85em; color: var(--chrome-ink);
    line-height: 1.55;
    background: var(--chrome);
    border: 1px solid var(--chrome-ink);
    border-radius: 10px;
    padding: .7em 1em;
    margin: 0 0 1.4em;
    cursor: pointer;
  }
  #library .howto:hover { background: var(--chrome-ink); color: var(--chrome); }
  #library .howto:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .doc-title h1 { font-size: 1.9em; line-height: 1.15; margin: 0 0 .2em; }
.doc-title h2 { font-size: 1.25em; font-weight: 600; color: var(--muted); margin: 0 0 .1em; }

  .doc-title .byline { font-size: .95em; color: var(--muted); margin: 0 0 1.2em; }

  /* The byline is the last line of the title block (h1 > h2 > h3 > byline), so
     the tagline now only needs the same small step down as the lines above it —
     its old 1.2em used to separate it from the body, which is the byline's job
     now, and that is what keeps the four lines reading as one block. */
  .doc-title h3 { font-size: 1em; font-style: italic; color: var(--accent); margin: 0 0 .2em; }
  h2, h3 { line-height: 1.3; margin: 1.8em 0 .6em; }
  h2 { font-size: 1.35em; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
  h3 { font-size: 1.1em; }

  p { margin: 0 0 1em; }

  /* explained (white panel) blocks — white box, near-black text, the same
     font size as the rest of the paper. The panel was blue until the focus
     pass; the shape, the padding and the zero-shift guarantees below are all
     unchanged, only the surface flipped. Because it is white it needs the
     near-black ink, and because the page around it goes black (see
     :root[data-focus="explain"]) it is now the only white thing on screen —
     the accent is kept so a quote rule, a callout label or raw math inside
     the panel still reads as the app's one colour. */
  .explained {
    --bg: #ffffff;
    --ink: #161616;
    --muted: #555555;
    --accent: #3d88d8;
    --line: #e2e2e2;
    --surface: #f0f0f0;
    --code-bg: #f0f0f0;
    --quote-bg: #f7f7f7;
    --quote-ink: #161616;
    font-size: var(--fs);
    background: var(--bg);
    color: var(--ink);
  }
  /* switchable blocks are outlined at all times, on every device, so they
     read as clickable — except once switched: the explained panel wears no
     outline (the panel itself is the "explained" state; the pointer cursor
     and the badge still mark it as revertible). Hover just thickens the
     line. Outlines don't participate in layout, so the zero-shift guarantee
     is unaffected. */
  /* The "switchable block" marker, in the theme token: a fixed #ffffff was
     only ever visible on a dark page, so the token is what keeps the ring
     readable on whichever surface the block is sitting on — the reading
     view states it as near-black for the same reason. .explained is
     excluded: the panel itself is the "explained" state. */
  .toggleable:not(.explained) { outline: 1px solid var(--outline); outline-offset: 3px; }
  .toggleable:not(.explained):hover { outline: 2px solid var(--accent); }
  /* a few px of air around the text of explained paragraphs/lists: the
     negative margins cancel the added padding exactly, so the text and the
     flow keep their positions — only the panel grows outward.
     The sides are set individually (NOT the `padding` shorthand) because a
     shorthand would also reset padding-left, and for lists that padding is
     the bullet indent — see the list rule below. */
  p.explained, ul.explained, ol.explained {
    padding-top: 5px;
    padding-right: 8px;
    padding-bottom: 5px;
    margin: -5px -8px calc(1em - 5px);
  }
  p.explained { padding-left: 8px; }
  /* Lists: keep the 1.6em indent (that's what positions the item text) and
     widen it by the same 8px the negative margin moved the box left, so the
     text stays put while the panel grows leftwards — far enough that the
     bullet/number markers, which browsers draw in the padding area just
     outside the text, land INSIDE the panel instead of hanging off its left
     edge. Nested lists keep the plain 1.6em (the outer panel already covers
     them and they must not inherit the widened indent). */
  ul.explained, ol.explained { padding-left: calc(1.6em + 8px); }
  ul.explained ul, ul.explained ol, ol.explained ul, ol.explained ol {
    padding-left: 1.6em;
  }

  /* explained blocks that already carry their own padding keep it */
  .explained pre, .explained blockquote, .explained table, .explained .callout { margin: 0; }
  .explained .callout { background: var(--code-bg); }

  /* the explained prefix echoes the drafted ✳️***Explained:*** markers —
     a square ✳ badge, then a bold italic "Explained:" label. The gap
     between the badge and the label is a single typed space (the text node
     below), so the whole prefix reads "✳️ Explained:". The badge INVERTED
     with the panel: it was a white square carrying a blue ✳, which is
     invisible the moment the square sits on a white panel, so it is now the
     panel's near-black square carrying a white ✳ — 17.6:1, and still the
     app's achromatic palette. Literal colours, not var(--accent): panels
     redefine --accent, so a token would change meaning between here and
     there. Inline with the text for paragraph / quote / heading panels; on
     LIST panels it is a lead line of its own with the bullets starting on
     the next line (see buildEl). */
  .exlab { font-weight: 700; font-style: italic; white-space: nowrap; }
  /* The badge is upright even though the label is italic: the label's slant
     leans the asterisk to the right (measured +8% of the square's width off
     centre). `line-height: .85em` then pulls the ink back up — the ✳ glyph
     from the fallback font sits ~6% of the square's height below the middle of
     its own em box, so the short line box recentres it. Both values were
     measured, not guessed: the ink now lands within 1% of the square's centre
     on each axis (was +8% right / +11% down).

     `vertical-align` lines the badge up with the WORD it sits next to, not with
     the line box. At -.12em the ✳ ink measured 2.94px *below* the middle of
     "Explained:" (cap top to baseline) — the box hung under the baseline and
     the mark read as dropped. .07em puts the ink on that cap middle: measured
     5.38px above the baseline against a 5.31px cap middle, i.e. 0.06px out. The
     target is the INK, not the box: `line-height` above leaves the mark ~1.6px
     above the square's own centre on purpose, so centring the square on the
     word would push the mark visibly high. */
  .exlab .exstar {
    display: inline-block;
    width: 1.05em;
    height: 1.05em;
    background: #161616;
    color: #ffffff;
    text-align: center;
    line-height: .85em;
    font-size: .9em;
    font-style: normal;
    font-weight: 700;
    vertical-align: .07em;
  }
  /* List panels: the label sits directly in the <ul>/<ol> before the first
     <li>, so `display: block` gives it its own line and the first bullet
     drops one line down. The -1.6em margin cancels the list indent that
     positions the item text, so the prefix starts at the same 8px from the
     panel's left edge as a paragraph panel's label instead of sitting out at
     the item-text column. (A span among the <li>s draws no marker, so the
     prefix line carries no bullet.) */
  ul.explained > .exlab, ol.explained > .exlab {
    display: block;
    margin-left: -1.6em;
  }

  blockquote {
    margin: 1em 0; padding: .6em 1.1em;
    border-left: 3px solid var(--accent);
    background: var(--quote-bg);
    font-style: italic; color: var(--quote-ink);
  }
  .callout {
    margin: 1em 0;
    padding: .8em 1em;
    background: var(--surface);
    /* border: 1px solid var(--line); */
    /* border-radius: 10px; */
  }
  .callout .clabel {
    display: inline-block; margin-bottom: .35em;
    font-family: var(--font-ui); font-weight: 700; font-size: .8em;
    color: var(--accent); text-transform: uppercase; letter-spacing: .06em;
  }
  ul, ol { margin: 0 0 1em; padding-left: 1.6em; }
  li { margin: .25em 0; }
  table { border-collapse: collapse; margin: 1em 0; width: 100%; font-size: .92em; }
  th, td { border: 1px solid var(--line); padding: .45em .6em; text-align: left; vertical-align: top; }
  th { background: var(--code-bg); }
  pre {
    background: var(--surface);
    /* border: 1px solid var(--line); */
    padding: .9em 1em;
    /* border-radius: 10px; */
    overflow-x: auto;
    font-size: .85em;
    line-height: 1.45;
  }
  code { font-family: "Cascadia Code", Consolas, monospace; font-size: .9em; }
  p code, li code, td code, th code { background: var(--code-bg); padding: .05em .35em; border-radius: 5px; }
  .math-raw { font-style: italic; color: var(--accent); font-family: "Cascadia Code", Consolas, monospace; }

  

  .foot {
    margin-top: 3em; color: var(--muted); font-size: .8em;
    border-top: 1px solid var(--line); padding-top: 1em;
  }
</style>
</head>
<body>

<header id="topbar">
  <span class="app">The Nerd Switch</span>
  <button id="homeBtn" title="Library">☰</button>
  <span class="spacer"></span>
  <button id="badge" class="badge" title="Turn off every explained box">Original</button>
</header>

<main id="container">
  <div id="doc"></div>
  <div id="library" class="hidden"><button type="button" id="themeBtn" class="howto" aria-pressed="false">Every outlined block has an explanation. Click to switch; click again to switch back.</button><h1>Library</h1><div id="libList"></div></div>
</main>

<!-- `hidden` from the markup, not from JS: the app boots to the library, and a
     pill that only un-hides when a paper opens must never flash on the way there.
     openBundle() -> hideLibrary() takes the class off. -->
<button id="topBtn" class="hidden" title="Back to top"><svg class="btt-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7.997 10 3.515-3.79a.672.672 0 0 1 .89-.076l.086.075L16 10l-3 .001V18h-2v-7.999L7.997 10z"/></svg><span>TO TOP</span></button>

<script src="bundle-light-reality-cycle.js"></script>
<script src="bundle-the-theory.js"></script>
<script src="bundle-humane.js"></script>
<!-- add one <script src="bundle-<id>.js"></script> per paper (build with build_bundle.py) -->
<script>
"use strict";

/* ------------------------------------------------------------------ */
/* state                                                               */
/* ------------------------------------------------------------------ */

var BUNDLES = window.PAPER_BUNDLES || {};
var state = {
  topIndex: 0,        // item index currently at the top of the viewport
  items: [],          // flattened paper: {kind, o, e}
  els: [],            // rendered DOM elements aligned to items
  explained: {},      // item index -> true when that block shows the "everyone" voice
  bundle: null        // selected paper bundle (null = library view)
};
var PROG_KEY = "ds.progress:";  // {i, x} — full per-paper key set in openBundle()
var LAST_KEY = "ds.last";       // last opened bundle id

/* ------------------------------------------------------------------ */
/* flatten bundle -> items                                             */
/* ------------------------------------------------------------------ */

function flatten(B) {
  var items = [];
  items.push({ kind: "title", o: {
      kind: "title",
      title: B.title.original, subtitle: B.subtitle.original, tagline: B.tagline.original,
      author: B.author
    }, e: {
      kind: "title",
      title: B.title.everyone, subtitle: B.subtitle.everyone, tagline: B.tagline.everyone,
      author: B.author
    }});
  if (B.epigraph && (B.epigraph.original || B.epigraph.everyone)) {
    items.push({ kind: "quote", o: side("quote", B.epigraph.original), e: side("quote", B.epigraph.everyone) });
  }
  (B.lead || []).forEach(function (p) {
    if (p.original || p.everyone) items.push({ kind: pairKind(p), o: p.original, e: p.everyone });
  });
  B.sections.forEach(function (sec) {
    items.push({ kind: "heading", level: 2, o: sec.heading.original, e: sec.heading.everyone });
    sec.blocks.forEach(function (p) { items.push({ kind: pairKind(p), o: p.original, e: p.everyone }); });
    (sec.subsections || []).forEach(function (sub) {
      items.push({ kind: "heading", level: 3, o: sub.heading.original, e: sub.heading.everyone });
      sub.blocks.forEach(function (p) { items.push({ kind: pairKind(p), o: p.original, e: p.everyone }); });
    });
  });
  return items;
}
function side(kind, obj) {
  if (!obj) return null;
  if (typeof obj === "string") return { kind: kind, text: obj };
  return { kind: kind, text: obj.text };
}
function pairKind(p) { return (p.original || p.everyone || {}).kind || "paragraph"; }

/* ------------------------------------------------------------------ */
/* rendering                                                           */
/* ------------------------------------------------------------------ */

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function renderMath(src) {
  try {
    if (window.katex) return window.katex.renderToString(src, { throwOnError: false, displayMode: false });
  } catch (e) {}
  return '<span class="math-raw">[' + esc(src) + ']</span>';
}

function mdInline(text) {
  // pull inline math out of the RAW text BEFORE escaping: KaTeX must
  // receive unescaped LaTeX — esc() would turn a prime (' -> &#39;) and
  // any &, <, >, " into entities and KaTeX would choke on them
  var math = [];
  var t = text.replace(/\$([^$\n]+)\$/g, function (m, src) {
    math.push(src);
    return "\u0000M" + (math.length - 1) + "\u0000";
  });
  t = esc(t);
  // wikilinks: [[Title]] -> Title ; [[Title|alias]] -> alias
  t = t.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function (m, a, b) { return "<b>" + (b || a) + "</b>"; });
  // markdown links: [text](url) -> text
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1");
  // inline code
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  // bold then italic
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  // reinject typeset math last so KaTeX's HTML never passes the markdown passes
  t = t.replace(/\u0000M(\d+)\u0000/g, function (m, n) { return renderMath(math[+n]); });
  return t;
}

function makeTitle(sideObj) {
  var el = document.createElement("div");
  el.className = "doc-title";
  el.innerHTML = "<h1>" + esc(sideObj.title) + "</h1>"
    + (sideObj.subtitle ? "<h2>" + esc(sideObj.subtitle) + "</h2>" : "")
    + (sideObj.tagline ? "<h3>" + esc(sideObj.tagline) + "</h3>" : "")
    + (sideObj.author ? "<p class=\"byline\">by " + esc(sideObj.author) + "</p>" : "");
  return el;
}
function makeQuote(text) {
  var el = document.createElement("blockquote");
  el.innerHTML = mdInline(text);
  return el;
}
function makeHeading(item, sideObj) {
  sideObj = sideObj || item.o;
  if (!sideObj) return null;
  var el = document.createElement(item.level === 3 ? "h3" : "h2");
  el.textContent = sideObj.text;
  return el;
}
function makeCallout(text) {
  var lines = text.split("\n");
  var label = "";
  var m = lines[0].match(/^\[![a-z]+\]\s*(.*)$/);
  if (m) { label = m[1] || lines[0]; lines = lines.slice(1); }
  var el = document.createElement("div");
  el.className = "callout";
  el.innerHTML = (label ? '<span class="clabel">' + esc(label) + "</span>" : "")
    + lines.map(function (l) { return "<p>" + mdInline(l) + "</p>"; }).join("");
  return el;
}
function makeList(raw) {
  var root = document.createElement("ul");
  var stack = [{ indent: 0, list: root }];
  var first = true;
  raw.split("\n").forEach(function (line) {
    var m = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (!m) return;
    var indent = m[1].replace(/\t/g, "  ").length;
    var numbered = /\d/.test(m[2]);
    // the first line decides the top-level list type
    if (first) {
      if (numbered) {
        var ol = document.createElement("ol");
        root = ol;
        stack = [{ indent: 0, list: ol }];
      }
      first = false;
    }
    // climb back up while the new item is less indented than the current list
    while (stack.length > 1 && indent < stack[stack.length - 1].indent) stack.pop();
    var top = stack[stack.length - 1];
    var li = document.createElement("li");
    li.innerHTML = mdInline(m[3]);
    if (indent > top.indent) {
      // nest inside the previous item (skip if the list is still empty)
      var parent = top.list.lastChild;
      if (parent) {
        var nested = document.createElement(numbered ? "ol" : "ul");
        parent.appendChild(nested);
        stack.push({ indent: indent, list: nested });
        top = stack[stack.length - 1];
      }
    }
    top.list.appendChild(li);
  });
  return root;
}
function makeTable(raw) {
  var rows = raw.split("\n").filter(function (r) { return r.trim(); });
  var table = document.createElement("table");
  rows.forEach(function (row, ri) {
    var cells = row.replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
    var tr = document.createElement("tr");
    cells.forEach(function (c) {
      var cell = document.createElement(ri === 0 ? "th" : "td");
      cell.innerHTML = mdInline(c);
      tr.appendChild(cell);
    });
    table.appendChild(tr);
  });
  return table;
}
function makeCode(text) {
  var pre = document.createElement("pre");
  var code = document.createElement("code");
  code.textContent = text;
  pre.appendChild(code);
  return pre;
}
function makeParagraph(text) {
  var el = document.createElement("p");
  el.innerHTML = mdInline(text);
  return el;
}

// structural blocks (the title) always stay in the original voice; everything
// else follows the per-block "explained" flag when set. Section headings never
// click anyway (their text is identical on both sides); a content block that
// is rendered as a heading-style flow map (e.g. the LRC cycle line) CAN toggle.
function isStructural(item) { return item.kind === "title"; }
function isToggleable(item) {
  // only blocks whose "for everyone" version actually differs are clickable —
  // identical blocks (and structural ones) stay plain
  return !isStructural(item) && !!item.o && !!item.e && item.o.text !== item.e.text;
}
function sideFor(item, i) {
  return (state.explained[i] && item.e) ? item.e : item.o;
}
function buildEl(item, i) {
  var sideObj = sideFor(item, i);
  if (!sideObj) return null;
  var el;
  switch (sideObj.kind) {
    case "title":    el = makeTitle(sideObj); break;
    case "heading":  el = makeHeading(item, sideObj); break;
    case "quote":    el = makeQuote(sideObj.text); break;
    case "callout":  el = makeCallout(sideObj.text); break;
    case "list":     el = makeList(sideObj.text); break;
    case "table":    el = makeTable(sideObj.text); break;
    case "code":     el = makeCode(sideObj.text); break;
    case "paragraph":
    default:         el = makeParagraph(sideObj.text); break;
  }
  if (isToggleable(item)) el.className += " toggleable";
  if (state.explained[i] && item.e) {
    el.className += " explained";
    // prefix the panel with the ✳ badge + "Explained:" label. Inline with
    // the text for paragraph / quote / heading panels, but for LIST panels
    // the label is injected as the panel's own first child, BEFORE the
    // first <li>, so it gets a lead line to itself and the first bullet
    // starts one line down (a span sitting directly in the <ul> draws no
    // marker, so the prefix line stays clean). Skipped for table/code/callout
    // where an injection would break the structure (none of the current
    // papers produce explained blocks of those kinds).
    var k = item.e.kind;
    if (k !== "table" && k !== "code" && k !== "callout") {
      var lab = document.createElement("span");
      lab.className = "exlab";
      var badge = document.createElement("b");
      badge.className = "exstar";
      badge.textContent = "\u2733"; /* ✳ */
      lab.appendChild(badge);
      lab.appendChild(document.createTextNode(" Explained: "));
      el.insertBefore(lab, el.firstChild);
    }
  }
  return el;
}

/* ------------------------------------------------------------------ */
/* rendering pipeline + scroll preservation                            */
/* ------------------------------------------------------------------ */

var container = document.getElementById("container");
var doc = document.getElementById("doc");
var topBtn = document.getElementById("topBtn");

function topVisible() {
  // returns {index, offset} of the item nearest the top of the viewport
  for (var i = state.els.length - 1; i >= 0; i--) {
    var el = state.els[i];
    if (el && el.offsetTop <= container.scrollTop + 12) {
      return { index: i, offset: container.scrollTop - el.offsetTop };
    }
  }
  return { index: 0, offset: 0 };
}

function render() {
  var anchor = topVisible();
  doc.innerHTML = "";
  state.els = [];

  // first pass: build elements (respecting per-block explained flags)
  state.items.forEach(function (item, i) {
    var el = buildEl(item, i);
    if (!el) { state.els.push(null); return; }
    el.dataset.i = i;
    doc.appendChild(el);
    state.els.push(el);
  });

  // wait for KaTeX to finish (deferred script) then fix up any raw math
  applyKatexDiffs();

  // restore scroll to the anchored item (fall back to the nearest
  // rendered item above it if this voice has a gap at that index)
  var target = state.els[anchor.index];
  var k = anchor.index;
  while (!target && k >= 0) { target = state.els[--k]; }
  if (target) container.scrollTop = target.offsetTop + anchor.offset;
  else container.scrollTop = 0;
  // Reopen where you left off can be anywhere in the paper, so re-decide the
  // to-top pill here rather than trusting the scroll event that this
  // assignment will (or, under virtual time, will not) deliver.
  updateTopBtn();
}

function applyKatexDiffs() {
  // Boot renders can run before the deferred KaTeX script has loaded, so
  // they fall back to [raw] placeholders. Once KaTeX is in, upgrade those
  // spans in place to real typeset math (the DOM text node already decoded
  // the entities, so the placeholder source is clean LaTeX again).
  if (!window.katex) return;
  var raws = doc.querySelectorAll(".math-raw");
  if (!raws.length) return;
  for (var i = raws.length - 1; i >= 0; i--) {
    var el = raws[i];
    var m = el.textContent.match(/^\[([\s\S]*)\]$/);
    if (!m) continue;
    var fresh = document.createElement("span");
    fresh.innerHTML = renderMath(m[1]);
    el.parentNode.replaceChild(fresh, el);
  }
}

/* ------------------------------------------------------------------ */
/* persistence                                                         */
/* ------------------------------------------------------------------ */

function saveProgress() {
  var t = topVisible();
  state.topIndex = t.index;
  var x = [];
  Object.keys(state.explained).forEach(function (k) { if (state.explained[k]) x.push(+k); });
  x.sort(function (a, b) { return a - b; });
  localStorage.setItem(PROG_KEY, JSON.stringify({ i: t.index, x: x }));
}

function countExplained() {
  var n = 0;
  Object.keys(state.explained).forEach(function (k) { if (state.explained[k]) n++; });
  return n;
}

/* The badge is an *action*, not a state readout: it turns every explained box
   off. With nothing explained there is nothing to turn off, so it hides
   entirely — it only exists once at least one block has been switched over.

   It is also where the EXPLAIN FOCUS blackout is set (:root[data-focus]), for
   the same reason the pill's visibility lives here: this is the one function
   every explained-state change already passes through — toggleItem(),
   clearExplained(), openBundle() on restore, showLibrary() — so the blackout
   and the count can never disagree, and the page comes back the moment the
   last box is switched off. It is driven off the same `n`, and it is dropped
   on the library along with the pill, so the library is never blacked out by a
   paper's leftover state. */
function updateBadge() {
  var n = countExplained();
  var b = document.getElementById("badge");
  var focused = !!state.bundle && n > 0;
  if (focused) document.documentElement.setAttribute("data-focus", "explain");
  else document.documentElement.removeAttribute("data-focus");
  if (!focused) { b.classList.add("hidden"); return; }
  b.classList.remove("hidden");
  b.textContent = "Turn off " + n + " explained";
}

/* badge click: turn every explained block back to the original voice */
function clearExplained() {
  if (!state.bundle) return;
  state.explained = {};
  updateBadge();
  saveProgress();
  render();
}

/* per-block explain toggle */
function toggleItem(i) {
  var item = state.items[i];
  if (!item || !isToggleable(item)) return false;
  if (state.explained[i]) delete state.explained[i];
  else state.explained[i] = true;
  var old = state.els[i];
  var fresh = buildEl(item, i);
  if (!fresh) { delete state.explained[i]; return false; }
  fresh.dataset.i = i;
  state.els[i] = fresh;
  if (old && old.parentNode) old.parentNode.replaceChild(fresh, old);
  updateBadge();
  saveProgress();
  return true;
}

/* ------------------------------------------------------------------ */
/* library (paper picker)                                              */
/* ------------------------------------------------------------------ */

var library = document.getElementById("library");
var libList = document.getElementById("libList");

function buildLibrary() {
  libList.innerHTML = "";
  var ids = Object.keys(BUNDLES);
  if (!ids.length) {
    var p = document.createElement("p");
    p.className = "lib-empty";
    p.textContent = "No papers yet — build one with: python build_bundle.py";
    libList.appendChild(p);
    return;
  }
  ids.forEach(function (id) {
    var b = BUNDLES[id];
    var card = document.createElement("button");
    card.className = "lib-card";
    // the card shows the paper's full title: main title, then the rest of
    // it (the subtitle) on its own line, then the author. The LRC keeps the
    // dash + period of its displayed form; future papers fall back to their
    // bundle subtitle.
    var sub = { "light-reality-cycle": "Photon Pathways and Perceived Time." }[id]
      || (b.subtitle && (b.subtitle.original || b.subtitle.everyone)) || "";
    // The icon slot comes first, then a text column beside it (M33). The
    // button is display:flex, so the title/subtitle/author need wrapping in
    // one child for them to sit as a group to the right of the square.
    card.innerHTML =
        "<span class=\"lib-icon\" aria-hidden=\"true\"></span>"
      + "<span class=\"lib-text\">"
      + "<h2>" + esc(b.title.original) + "</h2>"
      + (sub ? "<p class=\"subtitle\">" + esc(sub) + "</p>" : "")
      + (b.author ? "<p class=\"byline\">by " + esc(b.author) + "</p>" : "")
      + "</span>";
    card.addEventListener("click", function () { openBundle(id); });
    libList.appendChild(card);
  });
}

function showLibrary() {
  state.bundle = null;
  state.items = [];
  state.els = [];
  doc.classList.add("hidden");
  library.classList.remove("hidden");
  topBtn.classList.add("hidden");
  // off the reading surface, so the library goes back to whichever theme state
  // the reader picked on the hint above it (see :root[data-view="read"])
  document.documentElement.removeAttribute("data-view");
  document.title = "The Nerd Switch";
  container.scrollTop = 0;
  updateTopBtn();
  updateBadge();
}

function hideLibrary() {
  library.classList.add("hidden");
  doc.classList.remove("hidden");
  // the reading surface: the paper is always white, whatever the library theme
  // state is. Rides this switch rather than being set inside openBundle(), so it
  // cannot survive the view switch and cannot be skipped by it — the same
  // argument as the to-top pill below.
  document.documentElement.setAttribute("data-view", "read");
  // The floating to-top pill belongs to the reading view, so it rides the same
  // switch as the document: hidden on the library, back when a paper is open.
  topBtn.classList.remove("hidden");
  updateTopBtn();
}

function openBundle(id) {
  var b = BUNDLES[id];
  if (!b) { showLibrary(); return; }
  state.bundle = b;
  state.items = flatten(b);
  PROG_KEY = "ds.progress:" + b.id;
  try { localStorage.setItem(LAST_KEY, b.id); } catch (e) {}
  var prog = null;
  try { prog = JSON.parse(localStorage.getItem(PROG_KEY) || "null"); } catch (e) {}
  document.title = "The Nerd Switch — " + b.title.original;
  hideLibrary();
  state.explained = {};
  (prog && prog.x || []).forEach(function (i) {
    if (typeof i === "number" && state.items[i]) state.explained[i] = true;
  });
  render();
  updateBadge();
  if (prog && typeof prog.i === "number") {
    var el = state.els[prog.i];
    if (el) container.scrollTop = el.offsetTop - 40;
  }
}

/* ------------------------------------------------------------------ */
/* wiring                                                              */
/* ------------------------------------------------------------------ */

/* click on a block swaps only that block to the "explained" voice (and back) */
doc.addEventListener("click", function (ev) {
  var t = ev.target;
  while (t && t !== doc) {
    var i = t.dataset && t.dataset.i;
    if (i !== undefined) { toggleItem(+i); return; }
    t = t.parentNode;
  }
});
document.getElementById("homeBtn").addEventListener("click", showLibrary);
document.getElementById("badge").addEventListener("click", clearExplained);

var scrollT = null;
container.addEventListener("scroll", function () {
  // not debounced: the pill has to track the finger, while saving reading
  // progress on a timer is fine to lag behind
  updateTopBtn();
  if (scrollT) return;
  scrollT = setTimeout(function () { scrollT = null; saveProgress(); }, 180);
});
window.addEventListener("beforeunload", saveProgress);

/* back to top: scroll the reading container to the top */
document.getElementById("topBtn").addEventListener("click", function () {
  try { container.scrollTo({ top: 0, behavior: "smooth" }); }
  catch (e) { container.scrollTop = 0; }
});

/* How far down the paper the reader has to be before the pill earns its place.
   200px is roughly the height of the title block, so it appears once the title
   has scrolled behind you and the body text is what you are actually reading —
   at the top it would be a button with nothing to do. */
var TOPBTN_AFTER = 200;

/* Only ever mirrors the scroll position. Called on open as well as on scroll,
   because a paper reopens at its *saved* position and so can legitimately come
   back already past the threshold — assuming "start hidden" there would hide a
   pill the reader is a long way down the page. */
function updateTopBtn() {
  topBtn.classList.toggle("at-top", container.scrollTop <= TOPBTN_AFTER);
}

/* BUILD:SW-START */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
/* BUILD:SW-END */

/* boot */
/* Theme toggle (M33). The two states live in CSS behind
   data-theme="invert" on <html>; this just flips the attribute and remembers
   the choice, the same way LAST_KEY is handled — a plain try/catch because
   localStorage throws outright in some privacy modes and a missing theme is
   not worth breaking boot over. Default is state A (no attribute), so a
   first-time visitor with no stored value gets the near-black page.

   This switch is the LIBRARY's, and only the library's: the hint button that
   drives it lives on that screen, and :root[data-view="read"] is declared
   after state B in the stylesheet, so a paper is white in either state. That
   is the point of the split — choosing how the shelves look must not choose
   how the paper looks. */
var THEME_KEY = "ds.theme";

function applyTheme(name) {
  if (name === "invert") document.documentElement.setAttribute("data-theme", "invert");
  else document.documentElement.removeAttribute("data-theme");
  var b = document.getElementById("themeBtn");
  // aria-pressed carries the state for screen readers, since the visible
  // label is the same sentence in both states.
  if (b) b.setAttribute("aria-pressed", name === "invert" ? "true" : "false");
}

function initTheme() {
  var stored = "";
  try { stored = localStorage.getItem(THEME_KEY) || ""; } catch (e) {}
  applyTheme(stored === "invert" ? "invert" : "");
  var btn = document.getElementById("themeBtn");
  if (!btn) return;
  btn.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "invert" ? "" : "invert";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });
}

function boot() {
  initTheme();
  buildLibrary();

  // deep link wins (?p=<id>), then the last-opened paper, then the library
  var wanted = "";
  try { wanted = new URLSearchParams(location.search).get("p") || ""; } catch (e) {}
  if (!wanted) {
    try { wanted = localStorage.getItem(LAST_KEY) || ""; } catch (e) {}
  }
  if (BUNDLES[wanted]) openBundle(wanted);
  else showLibrary();
}

/* KaTeX is a deferred script, so the boot render may beat it to the page;
   upgrade any fallback [raw] math spans once the library is in */
window.addEventListener("load", function () {
  if (window.katex) applyKatexDiffs();
});

boot();

/* window.ds seam — used by the automated click tests */
window.ds = {
  state: state,
  toggleItem: toggleItem,
  clearExplained: clearExplained,
  countExplained: countExplained,
  isToggleable: isToggleable,
  isStructural: isStructural,
  sideFor: sideFor,
  render: render
};
</script>
