<style>
  /* Original (blue) — light (default) */
  :root {
    --bg: #f4f4fa;
    --ink: #3d3d3d;
    --muted: #3d3d3d;
    --card: #ffffff;
    --accent: #3d88d8;
    --accent-ink: #ffffff;
    --line: #e4e0d6;
    --code-bg: #e4e7f1b2;
    --quote-bg: #ffffff;
    --quote-ink: #3d3d3d;
    --fs: 18px;
  }
  /* Everyone (red) — light */
  body.voice-everyone {
    --bg: #faf4f4;
    --accent: #d83d3d;
    --code-bg: #f1e4e4b2;
  }
  /* Original (blue) — dark */
  body.dark {
    --bg: #14171f;
    --ink: #dfe4ef;
    --muted: #8d95a8;
    --card: #1c2029;
    --accent: #6fa8e0;
    --accent-ink: #0c1622;
    --line: #2d3340;
    --code-bg: #1f232e;
    --quote-bg: #1c2029;
    --quote-ink: #dfe4ef;
  }
  /* Everyone (red) — dark */
  body.dark.voice-everyone {
    --bg: #1c1413;
    --ink: #e6d9d5;
    --muted: #a3908b;
    --card: #251b19;
    --accent: #e07a6f;
    --accent-ink: #2a0e0b;
    --line: #382925;
    --code-bg: #241b18;
    --quote-bg: #251b19;
    --quote-ink: #e6d9d5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    font-size: var(--fs);
    line-height: 1.65;
  }

  #topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
  }
  #topbar .app { font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  #topbar .spacer { flex: 1; }
  #topbar .badge {
    padding: 3px 10px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 600; white-space: nowrap;
  }
  #topbar button {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 10px; cursor: pointer; font-size: 13px;
  }
  #topbar button:hover { color: var(--ink); border-color: var(--muted); }

  #container {
    height: calc(100vh - 46px);
    height: calc(100dvh - 46px);
    overflow-y: auto;
    position: relative;
  }
  #doc {
    max-width: 46rem;
    margin: 0 auto;
    padding: 2.2rem 1.4rem 8rem;
  }
  #doc.hidden, #library.hidden, #toggle.hidden { display: none; }

  /* library (paper picker) */
  #library {
    max-width: 46rem;
    margin: 0 auto;
    padding: 2.2rem 1.4rem 8rem;
  }
  #library h1 {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: .8em; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    margin: 0 0 1.2em;
  }
  .lib-card {
    display: block; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 1.1rem 1.3rem; margin: 0 0 1rem; cursor: pointer;
    font-family: Georgia, "Times New Roman", serif; color: var(--ink);
  }
  .lib-card:hover { border-color: var(--accent); }
  .lib-card h2 { margin: 0 0 .1em; border: none; font-size: 1.25em; }
  .lib-card .byline { margin: 0 0 .7em; color: var(--muted); font-size: .92em; }
  .lib-card .voices { display: flex; flex-direction: column; gap: .35em; font-size: .85em; color: var(--muted); }
  .chip {
    display: inline-block; font-family: system-ui, sans-serif;
    font-size: .72em; font-weight: 700; padding: 1px 8px;
    border-radius: 999px; margin-right: 6px; vertical-align: 1px;
  }
  .chip.o { background: #3d88d8; color: #fff; }
  .chip.e { background: #d83d3d; color: #fff; }
  .lib-empty { color: var(--muted); font-style: italic; }

  .doc-title h1 { font-size: 1.9em; line-height: 1.15; margin: 0 0 .2em; }
.doc-title h2 { font-size: 1.25em; font-weight: 600; color: var(--muted); margin: 0 0 .1em; }

  .doc-title .byline { font-size: .95em; color: var(--muted); margin: 0 0 1.2em; }

  .doc-title h3 { font-size: 1em; font-style: italic; color: var(--accent); margin: 0 0 1.2em; }
  h2, h3 { line-height: 1.3; margin: 1.8em 0 .6em; }
  h2 { font-size: 1.35em; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
  h3 { font-size: 1.1em; }

  p { margin: 0 0 1em; }
  blockquote {
    margin: 1em 0; padding: .6em 1.1em;
    border-left: 3px solid var(--accent);
    background: var(--quote-bg);
    border-radius: 0 8px 8px 0;
    font-style: italic; color: var(--quote-ink);
  }
  .callout {
    margin: 1em 0;
    padding: .8em 1em;
    background: var(--card);
    /* border: 1px solid var(--line); */
    /* border-radius: 10px; */
  }
  .callout .clabel {
    display: inline-block; margin-bottom: .35em;
    font-family: system-ui, sans-serif; font-weight: 700; font-size: .8em;
    color: var(--accent); text-transform: uppercase; letter-spacing: .06em;
  }
  ul, ol { margin: 0 0 1em; padding-left: 1.6em; }
  li { margin: .25em 0; }
  table { border-collapse: collapse; margin: 1em 0; width: 100%; font-size: .92em; }
  th, td { border: 1px solid var(--line); padding: .45em .6em; text-align: left; vertical-align: top; }
  th { background: var(--code-bg); }
  pre {
    background: var(--card);
    /* border: 1px solid var(--line); */
    padding: .9em 1em;
    /* border-radius: 10px; */
    overflow-x: auto;
    font-size: .85em;
    line-height: 1.45;
  }
  code { font-family: "Cascadia Code", Consolas, monospace; font-size: .9em; }
  p code, li code, td code, th code { background: var(--code-bg); padding: .05em .35em; border-radius: 5px; }
  .math-raw { font-style: italic; color: var(--accent); font-family: "Cascadia Code", Consolas, monospace; }

  /* floating toggle */
  #toggle {
    position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 30;
    font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700;
    padding: 12px 18px; border: none; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
    cursor: pointer;
  }
  #toggle:hover { filter: brightness(1.08); }

  /* onboarding modal */
  #modal {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #modal.hidden { display: none; }
  #modal .box {
    background: var(--card); color: var(--ink);
    max-width: 30rem; padding: 1.8rem; border-radius: 16px;
    font-family: system-ui, -apple-system, sans-serif;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  #modal h2 { margin: 0 0 .5em; border: none; font-size: 1.3em; }
  #modal p { color: var(--muted); font-size: 14px; margin: 0 0 1.2em; }
  #modal .row { display: flex; gap: 10px; }
  #modal button {
    flex: 1; padding: 12px 8px; border-radius: 10px; border: none;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 700; cursor: pointer; font-size: 15px;
  }
  #modal button.alt { background: var(--code-bg); color: var(--ink); border: 1px solid var(--line); }

  .foot {
    margin-top: 3em; color: var(--muted); font-size: .8em;
    border-top: 1px solid var(--line); padding-top: 1em;
  }
</style>
</head>

<header id="topbar">
  <span class="app">The Dummy Switch</span>
  <button id="homeBtn" title="Library">☰</button>
  <span class="spacer"></span>
  <button id="fontMinus" title="Smaller text">A−</button>

  <div id="doc"></div>
  <div id="library" class="hidden"><h1>Library</h1><div id="libList"></div></div>
</main>

<div id="modal">
  <div class="box">
    <h2>Are you a scientist, or a dummy?</h2>
    <p>Both answers are valid and you can switch anytime — even in the middle of a hard paragraph. This just picks where you start.</p>
    <div class="row">
      <button id="pickScientist">I'm a scientist</button>

<script src="bundle-light-reality-cycle.js"></script>
<script src="bundle-the-theory.js"></script>
<!-- add one <script src="bundle-<id>.js"></script> per paper (build with build_bundle.py) -->
<script>
"use strict";

/* ------------------------------------------------------------------ */
/* state                                                               */
/* ------------------------------------------------------------------ */

var BUNDLES = window.PAPER_BUNDLES || {};
var VOICE = { ORIGINAL: "original", EVERYONE: "everyone" };
var state = {
  voice: VOICE.ORIGINAL,
  fs: 18,
  dark: false,
  topIndex: 0,        // item index currently at the top of the viewport
  items: [],          // flattened paper: {kind, o, e}
  els: [],            // rendered DOM elements aligned to items
  bundle: null        // selected paper bundle (null = library view)
};
var PREFS_KEY = "ds.pref";      // {voice}
var UI_KEY = "ds.ui";           // {fs, dark}
var PROG_KEY = "ds.progress:";  // {i, v} — full per-paper key set in openBundle()
var LAST_KEY = "ds.last";       // last opened bundle id
var prefLoaded = false;

/* ------------------------------------------------------------------ */
/* flatten bundle -> items                                             */
/* ------------------------------------------------------------------ */

function flatten(B) {
  var items = [];
  items.push({ kind: "title", o: {
      kind: "title",
      title: B.title.original, subtitle: B.subtitle.original, tagline: B.tagline.original,
      author: B.author
    }, e: {
      kind: "title",
      title: B.title.everyone, subtitle: B.subtitle.everyone, tagline: B.tagline.everyone,
      author: B.author
    }});
  if (B.epigraph && (B.epigraph.original || B.epigraph.everyone)) {
    items.push({ kind: "quote", o: side("quote", B.epigraph.original), e: side("quote", B.epigraph.everyone) });
  }
  B.sections.forEach(function (sec) {
    items.push({ kind: "heading", level: 2, o: sec.heading.original, e: sec.heading.everyone });
    sec.blocks.forEach(function (p) { items.push({ kind: pairKind(p), o: p.original, e: p.everyone }); });
    (sec.subsections || []).forEach(function (sub) {
      items.push({ kind: "heading", level: 3, o: sub.heading.original, e: sub.heading.everyone });
      sub.blocks.forEach(function (p) { items.push({ kind: pairKind(p), o: p.original, e: p.everyone }); });
    });
  });
  return items;
}
function side(kind, obj) {
  if (!obj) return null;
  if (typeof obj === "string") return { kind: kind, text: obj };
  return { kind: kind, text: obj.text };
}
function pairKind(p) { return (p.original || p.everyone || {}).kind || "paragraph"; }

/* ------------------------------------------------------------------ */
/* rendering                                                           */
/* ------------------------------------------------------------------ */

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function renderMath(src) {
  try {
    if (window.katex) return window.katex.renderToString(src, { throwOnError: false, displayMode: false });
  } catch (e) {}
  return '<span class="math-raw">[' + esc(src) + ']</span>';
}

function mdInline(text) {
  var t = esc(text);
  // wikilinks: [[Title]] -> Title ; [[Title|alias]] -> alias
  t = t.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function (m, a, b) { return "<b>" + (b || a) + "</b>"; });
  // markdown links: [text](url) -> text
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1");
  // math $...$
  t = t.replace(/\$([^$\n]+)\$/g, function (m, src) { return renderMath(src); });
  // inline code
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  // bold then italic
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return t;
}

function makeTitle(sideObj) {
  var el = document.createElement("div");
  el.className = "doc-title";
  el.innerHTML = "<h1>" + esc(sideObj.title) + "</h1>"
    + (sideObj.subtitle ? "<h2>" + esc(sideObj.subtitle) + "</h2>" : "")
    + (sideObj.author ? "<p class=\"byline\">by " + esc(sideObj.author) + "</p>" : "")
    + (sideObj.tagline ? "<h3>" + esc(sideObj.tagline) + "</h3>" : "");
  return el;
}
function makeQuote(text) {
  var el = document.createElement("blockquote");
  el.innerHTML = mdInline(text);
  return el;
}
function makeHeading(item) {
  var sideObj = state.voice === VOICE.ORIGINAL ? item.o : item.e;
  if (!sideObj) return null;
  var el = document.createElement(item.level === 3 ? "h3" : "h2");
  el.textContent = sideObj.text;
  return el;
}
function makeCallout(text) {
  var lines = text.split("\n");
  var label = "";
  var m = lines[0].match(/^\[![a-z]+\]\s*(.*)$/);
  if (m) { label = m[1] || lines[0]; lines = lines.slice(1); }
  var el = document.createElement("div");
  el.className = "callout";
  el.innerHTML = (label ? '<span class="clabel">' + esc(label) + "</span>" : "")
    + lines.map(function (l) { return "<p>" + mdInline(l) + "</p>"; }).join("");
  return el;
}
function makeList(raw) {
  var root = document.createElement("ul");
  var stack = [{ indent: 0, list: root }];
  var first = true;
  raw.split("\n").forEach(function (line) {
    var m = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (!m) return;
    var indent = m[1].replace(/\t/g, "  ").length;
    var numbered = /\d/.test(m[2]);
    // the first line decides the top-level list type
    if (first) {
      if (numbered) {
        var ol = document.createElement("ol");
        root = ol;
        stack = [{ indent: 0, list: ol }];
      }
      first = false;
    }
    // climb back up while the new item is less indented than the current list
    while (stack.length > 1 && indent < stack[stack.length - 1].indent) stack.pop();
    var top = stack[stack.length - 1];
    var li = document.createElement("li");
    li.innerHTML = mdInline(m[3]);
    if (indent > top.indent) {
      // nest inside the previous item (skip if the list is still empty)
      var parent = top.list.lastChild;
      if (parent) {
        var nested = document.createElement(numbered ? "ol" : "ul");
        parent.appendChild(nested);
        stack.push({ indent: indent, list: nested });
        top = stack[stack.length - 1];
      }
    }
    top.list.appendChild(li);
  });
  return root;
}
function makeTable(raw) {
  var rows = raw.split("\n").filter(function (r) { return r.trim(); });
  var table = document.createElement("table");
  rows.forEach(function (row, ri) {
    var cells = row.replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
    var tr = document.createElement("tr");
    cells.forEach(function (c) {
      var cell = document.createElement(ri === 0 ? "th" : "td");
      cell.innerHTML = mdInline(c);
      tr.appendChild(cell);
    });
    table.appendChild(tr);
  });
  return table;
}
function makeCode(text) {
  var pre = document.createElement("pre");
  var code = document.createElement("code");
  code.textContent = text;
  pre.appendChild(code);
  return pre;
}
function makeParagraph(text) {
  var el = document.createElement("p");
  el.innerHTML = mdInline(text);
  return el;
}

function buildEl(item) {
  var sideObj = state.voice === VOICE.ORIGINAL ? item.o : item.e;
  if (!sideObj) return null;
  switch (sideObj.kind) {
    case "title":    return makeTitle(sideObj);
    case "heading":  return makeHeading(item);
    case "quote":    return makeQuote(sideObj.text);
    case "callout":  return makeCallout(sideObj.text);
    case "list":     return makeList(sideObj.text);
    case "table":    return makeTable(sideObj.text);
    case "code":     return makeCode(sideObj.text);
    case "paragraph":
    default:         return makeParagraph(sideObj.text);
  }
}

/* ------------------------------------------------------------------ */
/* rendering pipeline + scroll preservation                            */
/* ------------------------------------------------------------------ */

var container = document.getElementById("container");
var doc = document.getElementById("doc");

function topVisible() {
  // returns {index, offset} of the item nearest the top of the viewport
  for (var i = state.els.length - 1; i >= 0; i--) {
    var el = state.els[i];
    if (el && el.offsetTop <= container.scrollTop + 12) {
      return { index: i, offset: container.scrollTop - el.offsetTop };
    }
  }
  return { index: 0, offset: 0 };
}

function render() {
  var anchor = topVisible();
  doc.innerHTML = "";
  state.els = [];
  var WHOLE = 0;
  var INSERT = 1; // block whose other voice is missing
  var seen = {};  // stamp blocks that exist in the other voice

  // first pass: build elements for the active voice
  state.items.forEach(function (item, i) {
    var el = buildEl(item);
    if (!el) { state.els.push(null); return; }
    el.dataset.i = i;
    doc.appendChild(el);
    state.els.push(el);
  });

  // wait for KaTeX to finish (deferred script) then fix up any raw math
  applyKatexDiffs();

  // restore scroll to the anchored item (fall back to the nearest
  // rendered item above it if this voice has a gap at that index)
  var target = state.els[anchor.index];
  var k = anchor.index;
  while (!target && k >= 0) { target = state.els[--k]; }
  if (target) container.scrollTop = target.offsetTop + anchor.offset;
  else container.scrollTop = 0;
}

function applyKatexDiffs() {
  // KaTeX replaces math spans it rendered; nothing needed here since we
  // render math inline at build time. Kept for parity/future use.
}

/* ------------------------------------------------------------------ */
/* persistence                                                         */
/* ------------------------------------------------------------------ */

function saveUI() {
  localStorage.setItem(UI_KEY, JSON.stringify({ fs: state.fs, dark: state.dark }));
}
function saveProgress() {
  var t = topVisible();
  state.topIndex = t.index;
  localStorage.setItem(PROG_KEY, JSON.stringify({ i: t.index, v: state.voice }));
}
function applyVoice() {
  document.body.classList.toggle("voice-original", state.voice === VOICE.ORIGINAL);
  document.body.classList.toggle("voice-everyone", state.voice === VOICE.EVERYONE);
  var iconLink = document.querySelector('link[rel="icon"]');
  if (iconLink) {
    iconLink.href = state.voice === VOICE.EVERYONE ? "icons/favicon-red.png" : "icons/favicon.png";
  }
}

function applyUI() {
  document.documentElement.style.setProperty("--fs", state.fs + "px");
  document.body.classList.toggle("dark", state.dark);
  applyVoice();
  document.getElementById("themeBtn").textContent = state.dark ? "☀" : "◐";
  updateBadge();
}

function updateBadge() {
  document.getElementById("badge").textContent =
    state.voice === VOICE.ORIGINAL ? "For Nerds" : "For Dummies";
}

function setVoice(v, rerender) {
  state.voice = v;
  updateBadge();
  applyVoice();
  var btn = document.getElementById("toggle");
  btn.textContent = v === VOICE.ORIGINAL ? "Dumb It Down" : "Read The Original";
  if (rerender) { render(); saveProgress(); }
}

/* ------------------------------------------------------------------ */
/* library (paper picker)                                              */
/* ------------------------------------------------------------------ */

var library = document.getElementById("library");
var libList = document.getElementById("libList");

function buildLibrary() {
  libList.innerHTML = "";
  var ids = Object.keys(BUNDLES);
  if (!ids.length) {
    var p = document.createElement("p");
    p.className = "lib-empty";
    p.textContent = "No papers yet — build one with: python build_bundle.py";
    libList.appendChild(p);
    return;
  }
  ids.forEach(function (id) {
    var b = BUNDLES[id];
    var card = document.createElement("button");
    card.className = "lib-card";
    card.innerHTML =
        "<h2>" + esc(b.title.original) + "</h2>"
      + (b.author ? "<p class=\"byline\">by " + esc(b.author) + "</p>" : "")
      + "<div class=\"voices\">"
      + "<span><span class=\"chip o\">Original</span>"
      + esc((b.tagline && b.tagline.original) || "") + "</span>"
      + "<span><span class=\"chip e\">Everyone</span>"
      + esc((b.tagline && b.tagline.everyone) || "") + "</span>"
      + "</div>";
    card.addEventListener("click", function () { openBundle(id); });
    libList.appendChild(card);
  });
}

function showLibrary() {
  state.bundle = null;
  state.items = [];
  state.els = [];
  doc.classList.add("hidden");
  library.classList.remove("hidden");
  document.getElementById("toggle").classList.add("hidden");
  document.title = "The Dummy Switch";
  container.scrollTop = 0;
}

function hideLibrary() {
  library.classList.add("hidden");
  doc.classList.remove("hidden");
  document.getElementById("toggle").classList.remove("hidden");
}

function openBundle(id) {
  var b = BUNDLES[id];
  if (!b) { showLibrary(); return; }
  state.bundle = b;
  state.items = flatten(b);
  PROG_KEY = "ds.progress:" + b.id;
  try { localStorage.setItem(LAST_KEY, b.id); } catch (e) {}
  var prog = null;
  try { prog = JSON.parse(localStorage.getItem(PROG_KEY) || "null"); } catch (e) {}
  document.title = "The Dummy Switch — " + b.title.original;
  hideLibrary();
  if (prog && prog.v) setVoice(prog.v === VOICE.EVERYONE ? VOICE.EVERYONE : VOICE.ORIGINAL, false);
  render();
  if (prog && typeof prog.i === "number") {
    var el = state.els[prog.i];
    if (el) container.scrollTop = el.offsetTop - 40;
  }
  if (!prefLoaded) modal.classList.remove("hidden");
}

/* ------------------------------------------------------------------ */
/* wiring                                                              */
/* ------------------------------------------------------------------ */

document.getElementById("toggle").addEventListener("click", function () {
  setVoice(state.voice === VOICE.ORIGINAL ? VOICE.EVERYONE : VOICE.ORIGINAL, true);
});
document.getElementById("homeBtn").addEventListener("click", showLibrary);
document.getElementById("fontPlus").addEventListener("click", function () {
  state.fs = Math.min(26, state.fs + 1); applyUI(); saveUI(); render();
});
document.getElementById("fontMinus").addEventListener("click", function () {
  state.fs = Math.max(14, state.fs - 1); applyUI(); saveUI(); render();
});
document.getElementById("themeBtn").addEventListener("click", function () {
  state.dark = !state.dark; applyUI(); saveUI();
});

var scrollT = null;
container.addEventListener("scroll", function () {
  if (scrollT) return;
  scrollT = setTimeout(function () { scrollT = null; saveProgress(); }, 180);
});
window.addEventListener("beforeunload", saveProgress);

/* share: Web Share API on phones, clipboard fallback on desktop */
function flash(msg) {
  var t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:86px;"
    + "background:var(--accent);color:var(--accent-ink);padding:8px 14px;"
    + "border-radius:999px;font:13px system-ui,sans-serif;z-index:40;";
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 1400);
}
document.getElementById("shareBtn").addEventListener("click", function () {
  var b = state.bundle;
  if (!b) { flash("Open a paper first"); return; }
  var url;
  try {
    url = location.protocol === "file:" ? location.href : location.pathname + "?p=" + b.id;
  } catch (e) { url = location.href; }
  var data = {
    title: document.title,
    text: b.title.original + " — read it in two voices, original and for everyone:",
    url: url
  };
  if (navigator.share) {
    navigator.share(data).catch(function () {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(location.href).then(function () {
      flash("Link copied");
    }).catch(function () {});
  } else {
    flash(location.href);
  }
});

/* BUILD:SW-START */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
/* BUILD:SW-END */

/* onboarding + boot */
var modal = document.getElementById("modal");
function boot() {
  var pref = null, ui = null;
  try {
    pref = JSON.parse(localStorage.getItem(PREFS_KEY) || "null");
    ui = JSON.parse(localStorage.getItem(UI_KEY) || "null");
  } catch (e) {}

  if (ui) { state.fs = ui.fs || 18; state.dark = !!ui.dark; }
  applyUI();

  if (pref && pref.voice) setVoice(pref.voice === VOICE.EVERYONE ? VOICE.EVERYONE : VOICE.ORIGINAL, false);
  prefLoaded = !!pref;

  buildLibrary();

  // deep link wins (?p=<id>), then the last-opened paper, then the library
  var wanted = "";
  try { wanted = new URLSearchParams(location.search).get("p") || ""; } catch (e) {}
  if (!wanted) {
    try { wanted = localStorage.getItem(LAST_KEY) || ""; } catch (e) {}
  }
  if (BUNDLES[wanted]) openBundle(wanted);
  else showLibrary();
}
document.getElementById("pickScientist").addEventListener("click", function () {
  prefLoaded = true;
  localStorage.setItem(PREFS_KEY, JSON.stringify({ voice: VOICE.ORIGINAL }));
  modal.classList.add("hidden");
  setVoice(VOICE.ORIGINAL, true);
});
document.getElementById("pickDummy").addEventListener("click", function () {
  prefLoaded = true;
  localStorage.setItem(PREFS_KEY, JSON.stringify({ voice: VOICE.EVERYONE }));
  modal.classList.add("hidden");
  setVoice(VOICE.EVERYONE, true);
});

boot();
</script>
</body>
